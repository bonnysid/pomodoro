name: Code quality
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - run: npm run build
      - run: npm test
      - run: npm run test:persistence
      - run: npm run test:new-day
      - run: npm run test:completion-window
      - run: npm run test:release-notes
